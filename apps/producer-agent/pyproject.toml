[project]
name = "osai-producer-agent"
version = "0.1.0"
description = "OSAI Executive Producer — a Google ADK SequentialAgent that drives the OSAI pipeline"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["producer_agent*"]
